name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    name: Attach card to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload dreame-vacuum-panel-card.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/dreame-vacuum-panel-card.js --clobber
